[project]
name = "tracellm-faultline"
version = "0.1.0"
description = "An evaluation framework for measuring how reliably tool-using LLM agents detect and recover from corrupted tool outputs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "cybr-wisp" }]
keywords = ["llm", "agents", "evaluation", "reliability", "tool-use", "fault-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "httpx>=0.27,<1.0",
    "openai>=1.30,<2.0",
    "ollama>=0.3,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "pre-commit>=3.7,<4.0",
]
postgres = ["asyncpg>=0.29,<1.0"]

[project.scripts]
faultline = "faultline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["faultline"]
mypy_path = "src"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
