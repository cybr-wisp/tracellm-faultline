# Full experiment — adaptive policy evaluation against oracle baseline
experiment_id: main-001
description: >
  Primary experiment: evaluate static and adaptive verification strategies
  against an oracle-optimal baseline, measuring regret across corruption modes.
research_question: >
  Can a corruption-aware agent learn an adaptive verification policy that
  minimizes expected total cost (token spend + error cost) across heterogeneous
  failure modes, and how close does this policy come to the oracle-optimal strategy?

tasks:
  # Order support domain
  - order-001
  - order-002
  - order-003
  - order-004
  # Scheduling domain
  - sched-001
  - sched-002
  - sched-003
  - sched-004
  # Structured data analysis domain
  - data-001
  - data-002
  - data-003
  - data-004

strategies:
  - baseline
  - retry
  - critic
  - verifier
  - adaptive  # The core experimental condition

corruption_modes:
  - clean
  - explicit_error
  - malformed
  - plausible_wrong

providers:
  - openai
  - ollama

cost_model:
  input_token_cost_per_1k: 0.005
  output_token_cost_per_1k: 0.015
  error_costs:
    none: 0.0
    minor: 0.10
    moderate: 1.00
    severe: 5.00
    critical: 25.00

trials: 5
concurrency: 4
timeout_seconds: 120.0
